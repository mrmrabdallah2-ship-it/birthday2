<head>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Helper SVG Component for icons
    const Icon = ({ name, className = "w-5 h-5", ...props }) => {
      const iconRef = useRef(null);
      useEffect(() => {
        if (window.lucide && iconRef.current) {
          window.lucide.createIcons();
        }
      }, [name]);
      return <i data-lucide={name} ref={iconRef} className={className} {...props}></i>;
    };

    // 45 Initial Love Notes
    const INITIAL_NOTES = [
      { id: 1, textEn: "Your presence makes the ordinary details of my day sweeter.", textAr: "وجودك بيخلّي بعض التفاصيل العادية في يومي أحلى.", color: "#C58D9B" },
      { id: 2, textEn: "No matter how hard your day is, I hope you always find something that brings peace to your heart.", textAr: "مهما كان يومك صعب، أتمنى تلاقي دايمًا حاجة تطمن قلبك.", color: "#A99BBE" },
      { id: 3, textEn: "You are so precious to me, and I hope you know that well.", textAr: "أنت شخص غالي عندي، وأتمنى تكون عارف ده كويس.", color: "#D6B98C" },
      { id: 4, textEn: "I hope we keep sharing sweet moments and memories we look back on together.", textAr: "أتمنى نفضل نشارك بعض لحظات حلوة وذكريات نفتكرها مع بعض.", color: "#F4E9E5" },
      { id: 5, textEn: "There's so much inside me I can't put into words, but you always feel your place in my heart.", textAr: "في كلام كتير جوايا مش بعرف أقوله، لكن أنت بتحس دايمًا بمكانتك عندي.", color: "#B5D2EE" },
      { id: 6, textEn: "I might not always know how to express it, but your presence means a lot to me.", textAr: "يمكن مش بعرف أعبّر دايمًا، لكن وجودك بيفرق معايا كتير.", color: "#E8D8B4" },
      { id: 7, textEn: "I thank God that I met you and that you are in my life.", textAr: "بشكر ربنا اني عرفتك و انك في حياتي.", color: "#C58D9B" },
      { id: 8, textEn: "I love that you became a part of my days and details.", textAr: "بحب إنك بقيت جزء من أيامي وتفاصيلي.", color: "#A99BBE" },
      { id: 9, textEn: "I hope you always see yourself through wonderful eyes, just as I see so many beautiful things in you.", textAr: "أتمنى تفضل دايمًا شايف نفسك بعين حلوة، زي ما أنا بشوف فيك حاجات جميلة كتير.", color: "#D6B98C" },
      { id: 10, textEn: "I hope you never lose your passion for the things you love.", textAr: "أتمنى متفقدش أبدًا شغفك بالحاجات اللي بتحبها.", color: "#F4E9E5" },
      { id: 11, textEn: "Always stay confident in yourself and your ability to achieve what you wish for.", textAr: "خاليك دائما مؤمن بنفسك وبقدرتك على تحقيق اللي بتتمناه.", color: "#B5D2EE" },
      { id: 12, textEn: "I am proud of every step you take, even the ones you might not see the value of.", textAr: "أنا فخورة بكل خطوة بتاخدها، حتى الخطوات اللي يمكن أنت مش شايف قيمتها.", color: "#E8D8B4" },
      { id: 13, textEn: "I hope you always find the appreciation you deserve for every effort you make.", textAr: "أتمنى تلاقي دايمًا التقدير اللي تستحقه على كل مجهود بتبذله.", color: "#C58D9B" },
      { id: 14, textEn: "I love your unique way of doing everything.", textAr: "بحب فيك طريقتك المختلفة وانت بتعمل اي حاجة.", color: "#A99BBE" },
      { id: 15, textEn: "I hope you always stay just like this and never change.", textAr: "أتمنى تفضل كده و ماتتغيرش.", color: "#D6B98C" },
      { id: 16, textEn: "I hope I am always a reason for your happiness.", textAr: "أتمنى أكون دايمًا سبب في انك تكون مبسوط.", color: "#F4E9E5" },
      { id: 17, textEn: "Your presence makes a huge difference to me in so many ways.", textAr: "وجودك بيفرق معايا في حاجات كتير.", color: "#B5D2EE" },
      { id: 18, textEn: "I hope we keep sharing sweet moments together.", textAr: "أتمنى نفضل نشارك بعض لحظات حلوة.", color: "#E8D8B4" },
      { id: 19, textEn: "I hope your new year is full of sweet opportunities and the beginnings you deserve.", textAr: "أتمنى سنتك الجديدة تكون مليانة فرص حلوة وبدايات تستاهلها.", color: "#C58D9B" },
      { id: 20, textEn: "May you achieve all your wishes and rejoice in things you've been waiting for.", textAr: "يارب تحقق كل اللي نفسك فيه، وتفرح بحاجات كنت مستنيها من زمان.", color: "#A99BBE" },
      { id: 21, textEn: "I hope the coming days are more beautiful than you expect.", textAr: "أتمنى الأيام الجاية تكون أجمل مما تتوقع.", color: "#D6B98C" },
      { id: 22, textEn: "May you find goodness, peace, and joy in every path you choose.", textAr: "يارب تلاقي في كل طريق بتختاره الخير والراحة والفرح.", color: "#F4E9E5" },
      { id: 23, textEn: "I hope you always remember that you deserve every beautiful thing you wish for.", textAr: "أتمنى تفتكر دايمًا إنك تستحق كل حاجة جميلة بتتمناها.", color: "#B5D2EE" },
      { id: 24, textEn: "May this year be full of small and big successes that bring you joy.", textAr: "يارب السنة دي تكون مليانة نجاحات صغيرة وكبيرة تفرحك.", color: "#E8D8B4" },
      { id: 25, textEn: "Happy birthday to you 🥳", textAr: "Happy birthday to you 🥳", color: "#C58D9B" },
      { id: 26, textEn: "I love you 🥰", textAr: "I love you 🥰", color: "#A99BBE" },
      { id: 27, textEn: "I miss you 😍", textAr: "I miss you 😍", color: "#D6B98C" },
      { id: 28, textEn: "🦫", textAr: "🦫", color: "#F4E9E5" },
      { id: 29, textEn: "🎁🥰", textAr: "🎁🥰", color: "#B5D2EE" },
      { id: 30, textEn: "🫂", textAr: "🫂", color: "#E8D8B4" },
      { id: 31, textEn: "💌💋", textAr: "💌💋", color: "#C58D9B" },
      { id: 32, textEn: "♥️", textAr: "♥️", color: "#A99BBE" },
      { id: 33, textEn: "🌚", textAr: "🌚", color: "#D6B98C" },
      { id: 34, textEn: "🌅", textAr: "🌅", color: "#F4E9E5" },
      { id: 35, textEn: "🐥", textAr: "🐥", color: "#B5D2EE" },
      { id: 36, textEn: "Today is such a special day.", textAr: "النهاردة يوم مميز اوي", color: "#E8D8B4" },
      { id: 37, textEn: "Every new day I love having you in my life.", textAr: "في كل يوم جديد حابة تكون موجود في حياتي .", color: "#C58D9B" },
      { id: 38, textEn: "Your daily morning text is one of my favorite things.", textAr: "صباح الخير بتاعت كل يوم من الحاجات اللي بحبها اوي.", color: "#A99BBE" },
      { id: 39, textEn: "You are the light of my eyes.", textAr: "نور عيني انت", color: "#D6B98C" },
      { id: 40, textEn: "The one who supports me in everything.", textAr: "اكتر حد بيدعمي كل حاجة", color: "#F4E9E5" },
      { id: 41, textEn: "I love you.", textAr: "بحبك", color: "#B5D2EE" },
      { id: 42, textEn: "The person who listens to me the most.", textAr: "اكتر حد بيسمعني", color: "#E8D8B4" },
      { id: 43, textEn: "I will keep annoying you and teasing you as much as I want anyway.", textAr: "هفضل اطلع عينك و ارخم عليك براحتي بردو", color: "#C58D9B" },
      { id: 44, textEn: "You are always special to me.", textAr: "انت دائما مميز عندي", color: "#A99BBE" },
      { id: 45, textEn: "🎉🥳", textAr: "🎉🥳", color: "#D6B98C" }
    ];

    const INITIAL_REASONS = [
      { id: 1, titleEn: "Your Caring Nature", titleAr: "قلبك الطيب", descEn: "How you know how to care for everything.", descAr: "اللي بيعرف ازاي يهتم بكل حاجه" },
      { id: 2, titleEn: "Your Words", titleAr: "كلامك", descEn: "When you suddenly send me a text when I need you most.", descAr: "لما بتبعت لي فجأة رسالة في وقت محتاجك فيه." },
      { id: 3, titleEn: "Your Ambition", titleAr: "طموحك", descEn: "Your love for your work and how busy like a bee you get 😂 so clever.", descAr: "حبك لشغلك و انك زي النحلة ساعات 😂 شطور." },
      { id: 4, titleEn: "Your Presence", titleAr: "وجودك", descEn: "Every time I feel safe and comfortable with you (You are my safe side).", descAr: "في كل وقت بحس فيه معاك بالأمان والراحة (You are my safe side)." },
    ];

    function App() {
      const [lang, setLang] = useState('ar');
      const isAr = lang === 'ar';

      const [cardData, setCardData] = useState(() => {
        const saved = localStorage.getItem('birthday_card_data');
        if (saved) {
          try { return JSON.parse(saved); } catch (e) {}
        }
        return {
          recipient: "إلى حبيبي...",
          greeting: "كل سنة وانت طيب يا أجمل شخص عرفته في حياتي",
          message: "كل سنة وانت طيب و اجمل شخص عرفته في حياتي بتمنى تكون سنتك الجديدة مليانة بكل حاجة حلوة و تقدر تحقق كل اللي نفسك فيه . وانا مبسوطة انك موجود في حياتي بكل المواقف اللي بينا و حتى التفاصيل الهبلة الصغيرة . بتمنالك تفضل بخير دايما و تكون مبسوط و ربنا معاك في كل خطوة بتعملها .",
          sender: "لاجمل جوجو في الدنيا ❤️"
        };
      });

      useEffect(() => {
        localStorage.setItem('birthday_card_data', JSON.stringify(cardData));
      }, [cardData]);

      const [cardOpened, setCardOpened] = useState(false);
      const [activeTab, setActiveTab] = useState('main');
      const [musicPlaying, setMusicPlaying] = useState(false);

      const [notes, setNotes] = useState(() => {
        const saved = localStorage.getItem('birthday_love_notes');
        if (saved) {
          try { return JSON.parse(saved); } catch (e) {}
        }
        return INITIAL_NOTES;
      });

      useEffect(() => {
        localStorage.setItem('birthday_love_notes', JSON.stringify(notes));
      }, [notes]);

      const [openedNoteIds, setOpenedNoteIds] = useState(() => {
        const saved = localStorage.getItem('birthday_opened_note_ids');
        if (saved) {
          try { return JSON.parse(saved); } catch (e) {}
        }
        return [];
      });

      useEffect(() => {
        localStorage.setItem('birthday_opened_note_ids', JSON.stringify(openedNoteIds));
      }, [openedNoteIds]);

      const [currentSelectedNote, setCurrentSelectedNote] = useState(null);
      const [isUnfolding, setIsUnfolding] = useState(false);

      const [isQuickAddOpen, setIsQuickAddOpen] = useState(false);
      const [quickNoteText, setQuickNoteText] = useState('');
      const [quickNoteColor, setQuickNoteColor] = useState('#C58D9B');

      const [reasons, setReasons] = useState(INITIAL_REASONS);

      const [isAdminOpen, setIsAdminOpen] = useState(false);
      const [adminPasscode, setAdminPasscode] = useState('');
      const [isAdminAuthenticated, setIsAdminAuthenticated] = useState(false);
      const [adminSubTab, setAdminSubTab] = useState('card');

      const [newNoteTextAr, setNewNoteTextAr] = useState('');
      const [newNoteColor, setNewNoteColor] = useState('#C58D9B');

      const [timeLeft, setTimeLeft] = useState({ days: 0, hours: 0, minutes: 0, seconds: 0 });
      const [isBirthdayReached, setIsBirthdayReached] = useState(false);

      const audioCtxRef = useRef(null);
      const oscillatorIntervalRef = useRef(null);

      useEffect(() => {
        const targetDate = new Date(2026, 10, 3, 0, 0, 0);

        const updateCountdown = () => {
          const now = new Date();
          const diff = targetDate - now;

          if (diff <= 0) {
            setIsBirthdayReached(true);
            setTimeLeft({ days: 0, hours: 0, minutes: 0, seconds: 0 });
          } else {
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((diff / (1000 * 60)) % 60);
            const seconds = Math.floor((diff / 1000) % 60);
            setTimeLeft({ days, hours, minutes, seconds });
          }
        };

        updateCountdown();
        const timer = setInterval(updateCountdown, 1000);
        return () => clearInterval(timer);
      }, []);

      useEffect(() => {
        if (musicPlaying) {
          try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtxRef.current = new AudioContext();
            const ctx = audioCtxRef.current;

            const happyBirthdayMelody = [
              [261.63, 0.4], [261.63, 0.4], [293.66, 0.8], [261.63, 0.8], [349.23, 0.8], [329.63, 1.6],
              [261.63, 0.4], [261.63, 0.4], [293.66, 0.8], [261.63, 0.8], [392.00, 0.8], [349.23, 1.6],
              [261.63, 0.4], [261.63, 0.4], [523.25, 0.8], [440.00, 0.8], [349.23, 0.8], [329.63, 0.8], [293.66, 1.6],
              [466.16, 0.4], [466.16, 0.4], [440.00, 0.8], [349.23, 0.8], [392.00, 0.8], [349.23, 2.2]
            ];

            let isPlaying = true;

            const playMelodyLoop = () => {
              if (!audioCtxRef.current || audioCtxRef.current.state === 'closed' || !isPlaying) return;
              let startTime = ctx.currentTime + 0.1;

              happyBirthdayMelody.forEach(([freq, dur]) => {
                if (!isPlaying) return;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, startTime);

                gain.gain.setValueAtTime(0, startTime);
                gain.gain.linearRampToValueAtTime(0.06, startTime + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.0001, startTime + dur - 0.05);

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start(startTime);
                osc.stop(startTime + dur);

                startTime += dur;
              });

              const totalDurationMs = happyBirthdayMelody.reduce((acc, [, dur]) => acc + dur, 0) * 1000 + 2000;
              oscillatorIntervalRef.current = setTimeout(playMelodyLoop, totalDurationMs);
            };

            playMelodyLoop();
          } catch (e) {
            console.error("Audio error:", e);
          }
        } else {
          if (oscillatorIntervalRef.current) clearTimeout(oscillatorIntervalRef.current);
          if (audioCtxRef.current && audioCtxRef.current.state !== 'closed') audioCtxRef.current.close();
        }

        return () => {
          if (oscillatorIntervalRef.current) clearTimeout(oscillatorIntervalRef.current);
          if (audioCtxRef.current && audioCtxRef.current.state !== 'closed') audioCtxRef.current.close();
        };
      }, [musicPlaying]);

      const pickRandomNote = () => {
        const unopened = notes.filter(n => !openedNoteIds.includes(n.id));
        if (unopened.length === 0) return;
        
        setIsUnfolding(false);
        const randomIndex = Math.floor(Math.random() * unopened.length);
        const selected = unopened[randomIndex];
        setCurrentSelectedNote(selected);

        setTimeout(() => {
          setIsUnfolding(true);
        }, 300);
      };

      const reopenNoteFromMemory = (note) => {
        setIsUnfolding(false);
        setCurrentSelectedNote(note);
        setTimeout(() => {
          setIsUnfolding(true);
        }, 200);
      };

      const keepMemory = () => {
        if (!currentSelectedNote) return;
        if (!openedNoteIds.includes(currentSelectedNote.id)) {
          setOpenedNoteIds([...openedNoteIds, currentSelectedNote.id]);
        }
        setCurrentSelectedNote(null);
        setIsUnfolding(false);
      };

      const handleAdminLogin = (e) => {
        e.preventDefault();
        if (adminPasscode === '2026' || adminPasscode === 'love') {
          setIsAdminAuthenticated(true);
        } else {
          alert(isAr ? 'كلمة المرور غير صحيحة (جرب 2026)' : 'Incorrect passcode (try 2026)');
        }
      };

      const handleAddNote = (e) => {
        e.preventDefault();
        const textToAdd = quickNoteText || newNoteTextAr;
        if (!textToAdd) return;
        const newNote = {
          id: Date.now(),
          textEn: textToAdd,
          textAr: textToAdd,
          color: quickNoteColor || newNoteColor
        };
        setNotes([...notes, newNote]);
        setQuickNoteText('');
        setNewNoteTextAr('');
        setIsQuickAddOpen(false);
        alert(isAr ? 'تم إضافة الورقة للبلورة بنجاح! ❤️' : 'Note added successfully to crystal! ❤️');
      };

      const handleDeleteNote = (id) => {
        setNotes(notes.filter(n => n.id !== id));
        setOpenedNoteIds(openedNoteIds.filter(noteId => noteId !== id));
      };

      const unopenedNotes = notes.filter(n => !openedNoteIds.includes(n.id));
      const openedNotesList = notes.filter(n => openedNoteIds.includes(n.id));

      return (
        <div dir={isAr ? 'rtl' : 'ltr'} className="min-h-screen bg-[#24252B] text-[#F4E9E5] relative overflow-x-hidden">
          
          {/* Stars background */}
          <div className="fixed inset-0 pointer-events-none z-0 overflow-hidden opacity-30">
            {[...Array(20)].map((_, i) => (
              <div 
                key={i}
                className="absolute animate-pulse"
                style={{
                  top: `${Math.random() * 100}%`,
                  left: `${Math.random() * 100}%`,
                  animationDuration: `${3 + Math.random() * 5}s`,
                  animationDelay: `${Math.random() * 3}s`
                }}
              >
                <Icon name={i % 2 === 0 ? "heart" : "sparkles"} className="w-4 h-4 text-[#C58D9B]" />
              </div>
            ))}
          </div>

          {/* Navbar */}
          <header className="relative z-20 border-b border-[#343640] bg-[#24252B]/80 backdrop-blur-md sticky top-0 px-4 sm:px-8 py-4 flex items-center justify-between">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-full bg-gradient-to-br from-[#C58D9B] to-[#A99BBE] flex items-center justify-center shadow-lg">
                <Icon name="heart" className="w-5 h-5 text-[#F4E9E5]" />
              </div>
              <div>
                <h1 className="text-lg font-serif font-bold text-[#D6B98C]">
                  {isAr ? 'عيد ميلاد سعيد يا جوجو' : 'Happy Birthday, Jojo'}
                </h1>
                <p className="text-xs text-[#A99BBE]">03 . 11 . 2026</p>
              </div>
            </div>

            <div className="flex items-center gap-2 sm:gap-4">
              <button 
                onClick={() => setMusicPlaying(!musicPlaying)}
                className={`flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs transition-all border ${musicPlaying ? 'bg-[#C58D9B]/20 border-[#C58D9B] text-[#F4E9E5]' : 'bg-[#343640]/50 border-[#343640] text-[#A99BBE]'}`}
              >
                <Icon name={musicPlaying ? "volume-2" : "volume-x"} className="w-4 h-4 text-[#D6B98C]" />
                <span className="hidden sm:inline">{musicPlaying ? (isAr ? 'الموسيقى مفعلة' : 'Music On') : (isAr ? 'تشغيل الموسيقى' : 'Play Music')}</span>
              </button>

              <button 
                onClick={() => setLang(isAr ? 'en' : 'ar')}
                className="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs bg-[#343640] border border-[#343640] hover:border-[#C58D9B] text-[#F4E9E5]"
              >
                <Icon name="globe" className="w-3.5 h-3.5 text-[#D6B98C]" />
                <span>{isAr ? 'English' : 'العربية'}</span>
              </button>

              <button 
                onClick={() => setIsAdminOpen(true)}
                className="p-2 rounded-full bg-[#343640] hover:bg-[#C58D9B]/30 text-[#A99BBE] border border-[#343640]"
              >
                <Icon name="shield" className="w-4 h-4 text-[#D6B98C]" />
              </button>
            </div>
          </header>

          <main className="relative z-10 max-w-5xl mx-auto px-4 sm:px-6 py-8 sm:py-12">
            {!cardOpened ? (
              <div className="flex flex-col items-center justify-center min-h-[75vh] text-center">
                <div className="relative max-w-lg w-full bg-[#343640]/60 backdrop-blur-xl border border-[#C58D9B]/30 rounded-3xl p-8 sm:p-12 shadow-2xl">
                  <div className="absolute -top-5 left-1/2 transform -translate-x-1/2 bg-gradient-to-r from-[#C58D9B] to-[#D6B98C] text-[#24252B] px-6 py-1.5 rounded-full text-xs font-bold uppercase">
                    {isAr ? 'مفاجأة خاصة جداً' : 'Special Surprise'}
                  </div>

                  <div className="my-6 flex justify-center">
                    <div className="w-20 h-20 rounded-full bg-[#24252B] border-2 border-[#D6B98C]/50 flex items-center justify-center shadow-inner">
                      <Icon name="gift" className="w-10 h-10 text-[#D6B98C]" />
                    </div>
                  </div>

                  <h2 className="text-2xl sm:text-3xl font-serif font-bold text-[#F4E9E5] mb-3">
                    {isAr ? 'في حاجة مميزة مستنياك...' : "There's something special waiting for you..."}
                  </h2>
                  <p className="text-sm sm:text-base text-[#A99BBE] mb-8 leading-relaxed">
                    {isAr 
                      ? 'حبيت اقولك كل سنة وأنت طيب بالطريقة اللي بتحبها.. يعني حاولت بس أكيد أنت أشطر في الموضوع ده ❤️'
                      : "I wanted to wish you a happy birthday the way you love... I tried, but you're definitely better at this!"
                    }
                  </p>

                  <button
                    onClick={() => setCardOpened(true)}
                    className="w-full sm:w-auto px-8 py-4 rounded-full bg-gradient-to-r from-[#C58D9B] to-[#D6B98C] text-[#24252B] font-bold text-sm sm:text-base shadow-lg hover:opacity-95 flex items-center justify-center gap-3 mx-auto"
                  >
                    <span>{isAr ? 'افتح مفاجأتك ❤️' : 'Open Your Surprise ❤️'}</span>
                    <Icon name="sparkles" className="w-5 h-5" />
                  </button>
                </div>
              </div>
            ) : (
              <div className="space-y-12">
                <div className="flex justify-center border-b border-[#343640] pb-4">
                  <div className="flex bg-[#343640]/50 p-1.5 rounded-full border border-[#343640]">
                    <button 
                      onClick={() => setActiveTab('main')}
                      className={`px-5 py-2 rounded-full text-xs sm:text-sm font-medium transition-all ${activeTab === 'main' ? 'bg-[#C58D9B] text-[#24252B]' : 'text-[#A99BBE]'}`}
                    >
                      {isAr ? 'الرسالة والعد التنازلي' : 'Card & Countdown'}
                    </button>
                    <button 
                      onClick={() => setActiveTab('crystals')}
                      className={`px-5 py-2 rounded-full text-xs sm:text-sm font-medium transition-all ${activeTab === 'crystals' ? 'bg-[#C58D9B] text-[#24252B]' : 'text-[#A99BBE]'}`}
                    >
                      {isAr ? `بلورة ورقات الحب (${notes.length}) 💎` : `${notes.length} Love Notes Crystal 💎`}
                    </button>
                    <button 
                      onClick={() => setActiveTab('reasons')}
                      className={`px-5 py-2 rounded-full text-xs sm:text-sm font-medium transition-all ${activeTab === 'reasons' ? 'bg-[#C58D9B] text-[#24252B]' : 'text-[#A99BBE]'}`}
                    >
                      {isAr ? 'ليه بحبك ❤️' : 'Why I Love You ❤️'}
                    </button>
                  </div>
                </div>

                {activeTab === 'main' && (
                  <div className="space-y-12">
                    <div className="max-w-2xl mx-auto bg-[#343640]/70 backdrop-blur-xl border border-[#D6B98C]/30 rounded-3xl p-8 sm:p-12 shadow-2xl text-center space-y-6">
                      <span className="text-xs tracking-widest uppercase text-[#D6B98C] font-semibold">
                        {cardData.recipient}
                      </span>
                      <h3 className="text-2xl sm:text-3xl font-serif font-bold text-[#F4E9E5]">
                        {cardData.greeting}
                      </h3>
                      <p className="text-base sm:text-lg text-[#F4E9E5] leading-relaxed font-light italic px-2 sm:px-4">
                        "{cardData.message}"
                      </p>
                      <div className="pt-4 border-t border-[#343640] inline-block px-8">
                        <p className="font-serif text-[#D6B98C] font-medium text-sm">
                          {cardData.sender}
                        </p>
                      </div>
                    </div>

                    <div className="max-w-3xl mx-auto bg-[#343640]/40 border border-[#343640] rounded-3xl p-6 sm:p-10 text-center space-y-6 shadow-xl">
                      <div className="space-y-2">
                        <h3 className="text-xl sm:text-2xl font-serif text-[#D6B98C]">
                          {isAr ? 'بنعد كل لحظة لحد يومك المميز.' : 'Counting every moment until your special day.'}
                        </h3>
                        <p className="text-xs sm:text-sm text-[#A99BBE]">
                          {isAr ? 'نوفمبر 3، 2026 – منتصف الليل' : 'November 3, 2026 – 00:00'}
                        </p>
                      </div>

                      <div className="grid grid-cols-2 sm:grid-cols-4 gap-4 max-w-xl mx-auto">
                        <div className="bg-[#24252B]/80 border border-[#C58D9B]/30 rounded-2xl p-4">
                          <span className="text-3xl sm:text-4xl font-serif font-bold text-[#D6B98C] block">{timeLeft.days}</span>
                          <span className="text-xs text-[#A99BBE] mt-1 block">{isAr ? 'يوم' : 'Days'}</span>
                        </div>
                        <div className="bg-[#24252B]/80 border border-[#C58D9B]/30 rounded-2xl p-4">
                          <span className="text-3xl sm:text-4xl font-serif font-bold text-[#D6B98C] block">{timeLeft.hours}</span>
                          <span className="text-xs text-[#A99BBE] mt-1 block">{isAr ? 'ساعة' : 'Hours'}</span>
                        </div>
                        <div className="bg-[#24252B]/80 border border-[#C58D9B]/30 rounded-2xl p-4">
                          <span className="text-3xl sm:text-4xl font-serif font-bold text-[#D6B98C] block">{timeLeft.minutes}</span>
                          <span className="text-xs text-[#A99BBE] mt-1 block">{isAr ? 'دقيقة' : 'Minutes'}</span>
                        </div>
                        <div className="bg-[#24252B]/80 border border-[#C58D9B]/30 rounded-2xl p-4">
                          <span className="text-3xl sm:text-4xl font-serif font-bold text-[#D6B98C] block">{timeLeft.seconds}</span>
                          <span className="text-xs text-[#A99BBE] mt-1 block">{isAr ? 'ثانية' : 'Seconds'}</span>
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                {activeTab === 'crystals' && (
                  <div className="space-y-12">
                    <div className="text-center max-w-xl mx-auto space-y-3">
                      <div className="flex items-center justify-center gap-2">
                        <h3 className="text-2xl sm:text-3xl font-serif font-bold text-[#D6B98C]">
                          {isAr ? `بلورة ورقات الحب (${notes.length})` : `${notes.length} Love Notes Crystal`}
                        </h3>
                        <button 
                          onClick={() => setIsQuickAddOpen(true)}
                          className="w-8 h-8 rounded-full bg-[#C58D9B] text-[#24252B] flex items-center justify-center shadow-md hover:scale-105"
                        >
                          <Icon name="plus" className="w-5 h-5" />
                        </button>
                      </div>
                      <p className="text-sm text-[#A99BBE]">
                        {isAr 
                          ? `بلورة تضم ${notes.length} ورقة ملونة مطوية. اختر ورقة، ويمكنك دائماً إعادة قراءة الأوراق التي فتحتها.`
                          : `A magical sphere filled with ${notes.length} folded notes. Pick a note, or re-read any opened note anytime.`
                        }
                      </p>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-8 items-center max-w-4xl mx-auto">
                      <div className="bg-[#343640]/50 border border-[#C58D9B]/40 rounded-3xl p-6 sm:p-8 text-center space-y-6 shadow-xl">
                        <div className="flex items-center justify-between border-b border-[#343640] pb-4">
                          <span className="text-xs font-semibold text-[#D6B98C]">
                            {isAr ? 'البلورة الأولى (أوراق لم تفتح)' : 'Crystal 1 – Unopened Notes'}
                          </span>
                          <span className="bg-[#C58D9B]/20 text-[#C58D9B] text-xs px-2.5 py-1 rounded-full font-bold">
                            {unopenedNotes.length} {isAr ? 'ورقة متبقية' : 'left'}
                          </span>
                        </div>

                        <div className="relative w-48 h-48 sm:w-56 sm:h-56 mx-auto rounded-full border-2 border-dashed border-[#C58D9B]/50 flex items-center justify-center bg-[#24252B]">
                          {unopenedNotes.length > 0 ? (
                            <div className="relative w-full h-full flex items-center justify-center overflow-hidden rounded-full">
                              {unopenedNotes.slice(0, 18).map((note, idx) => (
                                <div 
                                  key={note.id}
                                  className="absolute w-6 h-4 rounded-sm shadow-md"
                                  style={{
                                    backgroundColor: note.color,
                                    top: `${20 + (idx * 11) % 60}%`,
                                    left: `${20 + (idx * 17) % 60}%`,
                                    transform: `rotate(${idx * 30}deg)`
                                  }}
                                ></div>
                              ))}
                              <Icon name="sparkles" className="w-10 h-10 text-[#D6B98C] opacity-40" />
                            </div>
                          ) : (
                            <div className="text-center p-4">
                              <Icon name="check" className="w-10 h-10 text-[#D6B98C] mx-auto mb-2" />
                              <p className="text-xs text-[#A99BBE]">
                                {isAr ? 'اكتشفت الورق كله! ❤️' : 'All notes discovered! ❤️'}
                              </p>
                            </div>
                          )}
                        </div>

                        <button
                          onClick={pickRandomNote}
                          disabled={unopenedNotes.length === 0}
                          className={`w-full py-3.5 rounded-2xl font-bold text-sm flex items-center justify-center gap-2 ${unopenedNotes.length > 0 ? 'bg-gradient-to-r from-[#C58D9B] to-[#D6B98C] text-[#24252B] hover:opacity-95' : 'bg-[#343640] text-gray-500 cursor-not-allowed'}`}
                        >
                          <Icon name="gift" className="w-4 h-4" />
                          <span>{isAr ? 'اختر ورقة' : 'Pick a Note'}</span>
                        </button>
                      </div>

                      <div className="bg-[#343640]/50 border border-[#A99BBE]/30 rounded-3xl p-6 sm:p-8 text-center space-y-6 shadow-xl">
                        <div className="flex items-center justify-between border-b border-[#343640] pb-4">
                          <span className="text-xs font-semibold text-[#A99BBE]">
                            {isAr ? 'البلورة الثانية (الأوراق المفتوحة)' : 'Crystal 2 – Opened Memories'}
                          </span>
                          <span className="bg-[#A99BBE]/20 text-[#A99BBE] text-xs px-2.5 py-1 rounded-full font-bold">
                            {openedNotesList.length} {isAr ? 'مفتوحة' : 'opened'}
                          </span>
                        </div>

                        <div className="relative w-48 h-48 sm:w-56 sm:h-56 mx-auto rounded-full border-2 border-dashed border-[#A99BBE]/40 flex flex-col items-center justify-start bg-[#24252B] p-4 overflow-y-auto space-y-2">
                          {openedNotesList.length === 0 ? (
                            <div className="h-full flex items-center justify-center text-center">
                              <p className="text-xs text-[#A99BBE]/60 px-4">
                                {isAr ? 'الأوراق التي تفتحها ستنتقل هنا ويمكنك الضغط عليها لقراءتها مجدداً.' : 'Notes you open settle here. Click any note to read it again.'}
                              </p>
                            </div>
                          ) : (
                            openedNotesList.map((note) => (
                              <button
                                key={note.id}
                                onClick={() => reopenNoteFromMemory(note)}
                                className="w-full text-xs p-2 rounded-xl bg-[#24252B]/90 hover:bg-[#343640] border border-white/10 text-[#F4E9E5] text-right flex items-center justify-between"
                              >
                                <span className="truncate flex-1 pr-1">{isAr ? note.textAr : note.textEn}</span>
                                <span className="w-2.5 h-2.5 rounded-full flex-shrink-0 mr-1" style={{ backgroundColor: note.color }}></span>
                              </button>
                            ))
                          )}
                        </div>

                        <div className="text-xs text-[#A99BBE]">
                          {unopenedNotes.length === 0 ? (
                            <span className="text-[#D6B98C] font-medium">
                              {isAr ? '❤️ اكتشفت كل حتة صغيرة من قلبي.' : "❤️ You've discovered every little piece of my heart."}
                            </span>
                          ) : (
                            <span>{isAr ? `متبقي ${unopenedNotes.length} ورقة لاكتشافها` : `${unopenedNotes.length} more notes left`}</span>
                          )}
                        </div>
                      </div>
                    </div>

                    {currentSelectedNote && (
                      <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-[#24252B]/80 backdrop-blur-md">
                        <div 
                          className="max-w-md w-full rounded-3xl p-8 shadow-2xl text-center"
                          style={{ backgroundColor: currentSelectedNote.color || '#C58D9B', color: '#24252B' }}
                        >
                          <div className="w-12 h-12 rounded-full bg-white/30 mx-auto flex items-center justify-center mb-4">
                            <Icon name="heart" className="w-6 h-6 text-[#24252B]" />
                          </div>
                          <p className="text-lg sm:text-xl font-serif font-medium leading-relaxed mb-8">
                            "{isAr ? currentSelectedNote.textAr : currentSelectedNote.textEn}"
                          </p>
                          <div className="flex gap-3">
                            <button
                              onClick={keepMemory}
                              className="flex-1 py-3 px-4 rounded-2xl bg-[#24252B] text-[#F4E9E5] text-xs font-bold shadow-lg"
                            >
                              {isAr ? 'حفظ في الذكريات' : 'Keep This Memory'}
                            </button>
                          </div>
                        </div>
                      </div>
                    )}
                  </div>
                )}

                {activeTab === 'reasons' && (
                  <div className="max-w-3xl mx-auto space-y-8">
                    <div className="text-center space-y-2">
                      <h3 className="text-2xl sm:text-3xl font-serif font-bold text-[#D6B98C]">
                        {isAr ? 'أشياء صغيرة بحبها فيك' : 'Little Things I Love About You'}
                      </h3>
                    </div>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      {reasons.map((r) => (
                        <div key={r.id} className="bg-[#343640]/40 border border-[#343640] p-6 rounded-2xl space-y-2">
                          <div className="flex items-center gap-2">
                            <Icon name="heart" className="w-4 h-4 text-[#C58D9B]" />
                            <h4 className="font-serif font-bold text-[#F4E9E5] text-base">
                              {isAr ? r.titleAr : r.titleEn}
                            </h4>
                          </div>
                          <p className="text-xs sm:text-sm text-[#A99BBE] leading-relaxed">
                            {isAr ? r.descAr : r.descEn}
                          </p>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            )}
          </main>

          {/* Quick Add Modal */}
          {isQuickAddOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-[#24252B]/90 backdrop-blur-md">
              <div className="max-w-md w-full bg-[#343640] border border-[#C58D9B]/40 rounded-3xl p-6 sm:p-8 shadow-2xl relative">
                <button 
                  onClick={() => setIsQuickAddOpen(false)}
                  className="absolute top-6 right-6 text-[#A99BBE] hover:text-[#F4E9E5]"
                >
                  <Icon name="x" className="w-6 h-6" />
                </button>
                <form onSubmit={handleAddNote} className="space-y-4">
                  <h3 className="text-lg font-serif font-bold text-[#D6B98C] mb-2">
                    {isAr ? 'إضافة ورقة جديدة للبلورة ❤️' : 'Add New Note to Crystal ❤️'}
                  </h3>
                  <div>
                    <textarea 
                      rows={4}
                      value={quickNoteText}
                      onChange={(e) => setQuickNoteText(e.target.value)}
                      placeholder={isAr ? "اكتبي رسالتك هنا..." : "Type your note here..."}
                      className="w-full p-3 bg-[#24252B] border border-[#343640] rounded-xl text-sm text-[#F4E9E5] focus:border-[#C58D9B] outline-none"
                      required
                    />
                  </div>
                  <button
                    type="submit"
                    className="w-full py-3 rounded-xl bg-gradient-to-r from-[#C58D9B] to-[#D6B98C] text-[#24252B] font-bold text-sm"
                  >
                    {isAr ? 'إضافة إلى البلورة' : 'Add to Crystal'}
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* Admin Modal */}
          {isAdminOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-[#24252B]/90 backdrop-blur-md">
              <div className="max-w-xl w-full bg-[#343640] border border-[#C58D9B]/40 rounded-3xl p-6 sm:p-8 shadow-2xl relative max-h-[90vh] overflow-y-auto">
                <button 
                  onClick={() => setIsAdminOpen(false)}
                  className="absolute top-6 right-6 text-[#A99BBE] hover:text-[#F4E9E5]"
                >
                  <Icon name="x" className="w-6 h-6" />
                </button>

                {!isAdminAuthenticated ? (
                  <form onSubmit={handleAdminLogin} className="space-y-6 text-center py-6">
                    <div className="w-12 h-12 rounded-full bg-[#C58D9B]/20 mx-auto flex items-center justify-center text-[#D6B98C]">
                      <Icon name="lock" className="w-6 h-6" />
                    </div>
                    <h3 className="text-xl font-serif font-bold text-[#F4E9E5]">
                      {isAr ? 'لوحة التحكم والتحرير' : 'Admin & Editor Mode'}
                    </h3>
                    <input
                      type="password"
                      value={adminPasscode}
                      onChange={(e) => setAdminPasscode(e.target.value)}
                      placeholder="Passcode (2026)"
                      className="w-full max-w-xs px-4 py-3 bg-[#24252B] border border-[#343640] rounded-xl text-center text-[#F4E9E5] outline-none"
                    />
                    <button
                      type="submit"
                      className="w-full max-w-xs py-3 rounded-xl bg-gradient-to-r from-[#C58D9B] to-[#D6B98C] text-[#24252B] font-bold text-sm block mx-auto"
                    >
                      {isAr ? 'دخول لوحة التحكم' : 'Enter Admin Panel'}
                    </button>
                  </form>
                ) : (
                  <div className="space-y-6">
                    <div className="flex items-center justify-between border-b border-[#24252B] pb-4">
                      <h3 className="text-lg font-serif font-bold text-[#D6B98C]">
                        {isAr ? 'إدارة محتوى الموقع' : 'Content Management'}
                      </h3>
                    </div>
                    <div className="space-y-4">
                      <div>
                        <label className="text-xs text-[#A99BBE] block mb-1">{isAr ? 'الرسالة الرومانسية' : 'Romantic Message'}</label>
                        <textarea 
                          rows={4}
                          value={cardData.message}
                          onChange={(e) => setCardData({...cardData, message: e.target.value})}
                          className="w-full p-2.5 bg-[#24252B] border border-[#343640] rounded-xl text-xs text-[#F4E9E5]"
                        />
                      </div>
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
